name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: OrderManagementApi/**/*.csproj

      - name: Restore solution
        run: dotnet restore OrderManagementApi/OrderManagementApi.slnx

      - name: Build solution
        run: dotnet build OrderManagementApi/OrderManagementApi.slnx --configuration Release --no-restore

      - name: Test solution
        run: dotnet test OrderManagementApi/OrderManagementApi.slnx --configuration Release --no-build --no-restore